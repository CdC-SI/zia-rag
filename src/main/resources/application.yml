spring:
  autoconfigure:
    exclude: org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration, org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration, org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration, org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration, org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  datasource:
    url: ${DS_URL:jdbc:postgresql://localhost:5432/pg_db}
    username: ${DS_USERNAME}
    password: ${DS_PASSWORD}
    hikari:
      maximum-pool-size: ${DS_MAX_POOL_SIZE:15}
      minimum-idle: ${DS_MIN_IDLE:1}
      idle-timeout: ${DS_IDLE_TIMEOUT:270000}
      keepalive-time: ${DS_KEEPALIVE_TIME:45000}
      max-lifetime: ${DS_MAX_LIFETIME:300000}
      auto-commit: false
  ai:
    vectorstore:
      pgvector:
        schema-name: ${PGVECTOR_SCHEMA_NAME:public}
        table-name: ${PGVECTOR_TABLE_NAME:vector_store}
        initialize-schema: false
        dimensions: ${PGVECTOR_DIMENSIONS:1024}
zia:
  rag:
    embedding:
      api-key: ${ZIA_EMBEDDING_API_KEY:}
      model: ${ZIA_EMBEDDING_MODEL:}
      base-url: ${ZIA_EMBEDDING_BASE_URL:}
      dimensions: ${ZIA_EMBEDDING_DIMENSIONS:1024}
    rerank:
      base-url: ${ZIA_RERANK_BASE_URL:}
      api-key: ${ZIA_RERANK_API_KEY:}
      model: ${ZIA_RERANK_MODEL:}
      truncate-prompt-tokens: ${ZIA_RERANK_TRUNCATE_PROMPT_TOKENS:16384}